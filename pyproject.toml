[project]
name = "ofdx-repair-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "datngothanhbn", email = "ngothanhdat13122007@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "greenlet==3.5.6",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "iniconfig==2.3.0",
    "packaging==26.3",
    "pluggy==1.6.0",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "sqlalchemy==2.0.54",
    "typing-extensions==4.16.0",
]

[project.scripts]
ofdx-repair-data = "ofdx_repair_data:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
